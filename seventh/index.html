<!DOCTYPE html>
<html lang="en">
<center>
<head>
  <meta charset="UTF-8">
  <title>Student Marks Entry</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    h2 {
      color: #333;
    }
    input {
      padding: 5px;
      margin: 5px;
      width: 80px;
    }
    button {
      margin-top: 15px;
      padding: 8px 15px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
    }
    button:hover {
      background-color: #45a049;
    }
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Student Marks Entry</h2>
  <label>No. of Students:</label>
  <input type="number" id="studentCount" min="1"><br><br>
  <label>No. of Subjects:</label>
  <input type="number" id="subjectCount" min="1"><br><br>
  <button id="nextBtn">Next</button>
  <div id="subjectSection"></div>
  <div id="marksSection"></div>
  <script src="script.js"></script>
</center>
</body>
</html>
