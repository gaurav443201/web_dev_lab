<!DOCTYPE html>
<html>
<head>
    <title>PRACTICAL 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary bg-opacity-25">

<div class="container d-flex justify-content-center align-items-center vh-100">
    
    <div class="card shadow p-4" style="width: 400px;">
        
        <div class="text-center">
            <h3 class="mb-3">WELCOME TO THE PAGE</h3>
            <img src="1.png" height="120" width="120" class="mb-3 rounded-circle">
            <p class="text-muted">Fill the login form to <strong>Login into the site</strong></p>
        </div>

        <!-- Opens fifth.html -->
        <form action="fifth.html">

            <div class="mb-3">
                <label class="form-label"><b>Name</b></label>
                <input type="text" class="form-control" placeholder="Enter Name" required>
            </div>

            <div class="mb-3">
                <label class="form-label"><b>Email</b></label>
                <input type="email" class="form-control" placeholder="Enter Email" required>
            </div>

            <div class="mb-3">
                <label class="form-label"><b>Gender</b></label><br>
                
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender">
                    <label class="form-check-label">Male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender">
                    <label class="form-check-label">Female</label>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label"><b>Date of Birth</b></label>
                <input type="date" class="form-control" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">SUBMIT</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
